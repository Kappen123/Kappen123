<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Play Live</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .nav-bar {
            width: 100%;
            background-color: #222;
            padding: 10px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: flex-start;
        }

        .back-btn {
            background-color: #00ffcc;
            color: #111;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .back-btn:hover {
            background-color: #ffffff;
            transform: scale(1.05);
        }

        .game-container {
            flex-grow: 1;
            width: 100%;
            max-width: 960px;
            max-height: 540px;
            margin: 20px;
            border: 3px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            overflow: hidden;
        }

        /* This is the magic window hosting the game frame */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Top bar to let you easily crawl back to your home menu -->
    <div class="nav-bar">
        <a href="index.html" class="back-btn">⬅ Back to Hub</a>
    </div>

    <!-- The actual game wrapper -->
    <div class="game-container">
        <iframe src="https://mit.edu" allowtransparency="true" allowfullscreen="true" scrolling="no"></iframe>
    </div>

</body>
</html>

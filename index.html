<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Hub</title>
    
    <!-- This links the Font Awesome library so you can use built-in icons -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        /* Modern Dark Mode Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            color: #00ffcc;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 40px;
        }

        /* The Grid System for the Icons */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 25px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Styling for each Individual Game Button */
        .game-card {
            background-color: #2a2a2a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 25px 15px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Hover Animation Effects */
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00ffcc;
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.2);
            background-color: #333333;
        }

        /* Styling for the Icons Inside the Cards */
        .game-card i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #00ffcc;
        }

        /* Text inside the Cards */
        .game-card span {
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <h1>My Custom Game Hub</h1>
    <p class="subtitle">Click an icon below to open a game directly in your browser.</p>

    <!-- The Grid holding all your game buttons -->
    <div class="game-grid">

        <!-- Button 1: Geometry Dash (Points directly to your internal gd.html page) -->
        <a href="gd.html" class="game-card">
            <i class="fa-solid fa-gamepad"></i>
            <span>Geometry Dash</span>
        </a>

        <!-- Button 2: Retro Games (Using a rocket icon) -->
        <a href="https://crazygames.com" target="_blank" class="game-card">
            <i class="fa-solid fa-rocket"></i>
            <span>CrazyGames Hub</span>
        </a>

        <!-- Button 3: Puzzle / Strategy (Using a chess knight icon) -->
        <a href="https://poki.com" target="_blank" class="game-card">
            <i class="fa-solid fa-chess-knight"></i>
            <span>Poki Games</span>
        </a>

        <!-- Button 4: Standard Browser Games (Using a ghost/pacman icon) -->
        <a href="https://google.com" target="_blank" class="game-card">
            <i class="fa-solid fa-ghost"></i>
            <span>Google Snake</span>
        </a>

    </div>

</body>
</html>
